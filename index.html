/* ================================================================
   TIC TAC TOE + CONNECT FOUR — UI + flow
   ================================================================ */
function TttUI(cfg, root){
  let dead = false;
  const seats = cfg.seats;
  const level = cfg.level;
  let b = new Array(9).fill(0); // 1 = X, 2 = O
  let turn = 1;                 // X starts
  let series = [0, 0, 0];
  let over = false;
  const MARK = {1:'<span class="x">✕</span>', 2:'<span class="o">◯</span>'};

  root.innerHTML =
    '<div class="screen ttt">' + UI.topbar('Tic Tac Toe', {restart:true}) +
    '<div class="content">' +
    '<div class="series-row">' +
      '<div class="series-box p1"><span class="sb-name">' + esc(seats[0].name) + ' ✕</span><span class="sb-score" id="t-s1">0</span></div>' +
      '<div class="series-box"><span class="sb-name" style="color:var(--faint)">DRAWS</span><span class="sb-score" style="color:var(--futed);font-size:20px;color:var(--faint)" id="t-sd">0</span></div>' +
      '<div class="series-box p2"><span class="sb-name">' + esc(seats[1].name) + ' ◯</span><span class="sb-score" id="t-s2">0</span></div>' +
    '</div>' +
    '<div class="status-line" id="t-status"></div>' +
    '<div class="ttt-board"><div class="ttt-grid" id="t-grid"></div><svg class="ttt-strike" id="t-strike" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>' +
    '<div style="text-align:center;padding-top:6px"><button class="btn btn-ghost" id="t-new">🔄 New round</button></div>' +
    '</div></div>';
  UI.bindTopbar(root, 'ttt');

  const grid = $('#t-grid'), status = $('#t-status'), strike = $('#t-strike');
  function render(){
    grid.innerHTML = b.map((v, i) => '<div class="tcell" data-i="' + i + '">' + (v ? MARK[v] : '') + '</div>').join('');
    $$('.tcell', grid).forEach(c => c.addEventListener('click', () => tap(+c.dataset.i)));
    $('#t-s1').textContent = series[0];
    $('#t-s2').textContent = series[1];
    $('#t-sd').textContent = series[2];
    updateStatus();
  }
  function updateStatus(msg){
    if(over) return;
    const pi = turn - 1;
    status.innerHTML = msg || (seats[pi].bot ? esc(seats[pi].name) + ' 🤖 is thinking…' : '<b>' + esc(seats[pi].name) + '</b> — your turn (' + (turn === 1 ? '✕' : '◯') + ')');
  }
  function tap(i){
    if(dead || over || b[i]) return;
    const pi = turn - 1;
    if(seats[pi].bot){ return; }
    play(i);
  }
  function play(i){
    if(dead || over || b[i]) return;
    b[i] = turn;
    Snd.pop(); buzz(10);
    render();
    const r = LOGIC.tttWinner(b);
    if(r){ finish(r); return; }
    turn = 3 - turn;
    updateStatus();
    maybeBot();
  }
  function maybeBot(){
    const pi = turn - 1;
    if(!seats[pi].bot || over) return;
    updateStatus();
    Timers.set(() => {
      if(dead || over) return;
      const i = LOGIC.tttBot(b, turn, level);
      if(i >= 0) play(i);
    }, 480 + Math.random() * 420);
  }
  function finish(r){
    over = true;
    if(r.w){
      const pi = r.w - 1;
      series[pi]++;
      r.line.forEach(i => $$('.tcell', grid)[i].classList.add('win'));
      // strike line
      const c = i => (i % 3) * 33.33 + 16.66, rr = i => Math.floor(i / 3) * 33.33 + 16.66;
      const a = r.line[0], z = r.line[2];
      strike.innerHTML = '<line x1="' + c(a) + '" y1="' + rr(a) + '" x2="' + c(z) + '" y2="' + rr(z) + '"/>';
      Snd.win(); buzz(35);
      if(!seats[pi].bot || seats[1 - pi].bot === seats[pi].bot){} // noop
      status.innerHTML = '🎉 <b>' + esc(seats[pi].name) + '</b> wins the round!';
      $('#t-s1').textContent = series[0]; $('#t-s2').textContent = series[1];
      if(series[pi] >= 5){
        Timers.set(() => { if(!dead) seriesModal(pi); }, 1100);
      } else {
        Timers.set(() => { if(!dead) Toast.show('🎉 ' + seats[pi].name + ' scores!'); }, 400);
      }
    } else {
      series[2]++;
      $('#t-sd').textContent = series[2];
      Snd.sad();
      status.innerHTML = '🤝 It\'s a draw!';
    }
  }
  function seriesModal(pi){
    Snd.win(); Confetti.burst(130);
    Modal.open({
      title:'🏅 Series winner!',
      html:'<div class="win-emoji">🏆</div><div class="win-name">' + esc(seats[pi].name) + '</div>' +
        '<div class="win-sub">takes the series ' + series[0] + ' – ' + series[1] + ' (' + series[2] + ' draws)</div>',
      dismiss:false,
      actions:[
        {label:'🏠 Home', cls:'btn-ghost', fn:() => UI.home()},
        {label:'🔁 Rematch', cls:'btn-primary', fn:() => UI.gameStart('ttt', UI.lastCfg)}
      ]
    });
  }
  $('#t-new').addEventListener('click', () => {
    if(dead) return;
    Snd.click();
    b = new Array(9).fill(0); turn = 1; over = false;
    strike.innerHTML = '';
    render();
    maybeBot();
  });
  render();
  maybeBot();
  return { destroy(){ dead = true; } };
}

/* ==================== CONNECT FOUR ==================== */
function C4UI(cfg, root){
  let dead = false;
  const seats = cfg.seats;
  const level = cfg.level;
  let g = LOGIC.c4New();
  let turn = 1; // 1 first player
  let over = false;
  let series = [0, 0, 0];

  root.innerHTML =
    '<div class="screen c4">' + UI.topbar('Connect Four', {restart:true}) +
    '<div class="content">' +
    '<div class="series-row">' +
      '<div class="series-box p1"><span class="sb-name">' + esc(seats[0].name) + '</span><span class="sb-score" id="c-s1">0</span></div>' +
      '<div class="series-box"><span class="sb-name" style="color:var(--faint)">DRAWS</span><span class="sb-score" style="font-size:20px;color:var(--faint)" id="c-sd">0</span></div>' +
      '<div class="series-box p2"><span class="sb-name">' + esc(seats[1].name) + '</span><span class="sb-score" id="c-s2">0</span></div>' +
    '</div>' +
    '<div class="status-line" id="c-status"></div>' +
    '<div class="c4-board"><div class="c4-cols" id="c-cols"></div></div>' +
    '<div style="text-align:center;padding-top:10px"><button class="btn btn-ghost" id="c-new">🔄 New round</button></div>' +
    '</div></div>';
  UI.bindTopbar(root, 'c4');

  const colsEl = $('#c-cols'), status = $('#c-status');
  function render(tappable){
    colsEl.innerHTML = '';
    for(let c = 0; c < 7; c++){
      const col = document.createElement('div');
      col.className = 'c4-col' + (tappable ? ' tappable' : '');
      col.dataset.c = c;
      for(let r = 0; r < 6; r++){
        const cell = document.createElement('div');
        cell.className = 'c4-cell';
        const v = g[r * 7 + c];
        if(v){
          const d = document.createElement('div');
          d.className = 'disc p' + v;
          d.style.setProperty('--d', ((r + 1) * 60) + 'px');
          cell.appendChild(d);
        }
        col.appendChild(cell);
      }
      col.addEventListener('click', () => tapCol(c));
      colsEl.appendChild(col);
    }
    $('#c-s1').textContent = series[0];
    $('#c-s2').textContent = series[1];
    $('#c-sd').textContent = series[2];
  }
  function updateStatus(msg){
    if(over) return;
    const pi = turn - 1;
    status.innerHTML = msg || (seats[pi].bot ? esc(seats[pi].name) + ' 🤖 is thinking…' : '<b>' + esc(seats[pi].name) + '</b> — your turn');
  }
  function tapCol(c){
    if(dead || over) return;
    const pi = turn - 1;
    if(seats[pi].bot) return;
    if(LOGIC.c4Drop(g, c) < 0){ Snd.buzz(); return; }
    play(c);
  }
  function play(c){
    if(dead || over) return;
    const r = LOGIC.c4Drop(g, c);
    if(r < 0) return;
    g[r * 7 + c] = turn;
    Snd.pop(); buzz(10);
    render(false);
    const w = LOGIC.c4Winner(g);
    if(w){ finish(w); return; }
    turn = 3 - turn;
    updateStatus();
    render(!seats[turn - 1].bot);
    maybeBot();
  }
  function maybeBot(){
    const pi = turn - 1;
    if(!seats[pi].bot || over) return;
    render(false);
    updateStatus();
    Timers.set(() => {
      if(dead || over) return;
      const c = LOGIC.c4Bot(g, turn, level);
      if(c >= 0) play(c);
    }, 550 + Math.random() * 450);
  }
  function finish(w){
    over = true;
    render(false);
    if(w.w){
      const pi = w.w - 1;
      series[pi]++;
      w.cells.forEach(i => {
        const r = Math.floor(i / 7), c = i % 7;
        const cell = $$('.c4-col')[c].children[r];
        if(cell) cell.firstChild.classList.add('win');
      });
      Snd.win(); buzz(40);
      status.innerHTML = '🎉 <b>' + esc(seats[pi].name) + '</b> connects four!';
      $('#c-s1').textContent = series[0]; $('#c-s2').textContent = series[1];
      if(series[pi] >= 5){
        Timers.set(() => { if(!dead) seriesModal(pi); }, 1200);
      }
    } else {
      series[2]++;
      $('#c-sd').textContent = series[2];
      Snd.sad();
      status.innerHTML = '🤝 Board full — it\'s a draw!';
    }
  }
  function seriesModal(pi){
    Snd.win(); Confetti.burst(130);
    Modal.open({
      title:'🏅 Series winner!',
      html:'<div class="win-emoji">🏆</div><div class="win-name">' + esc(seats[pi].name) + '</div>' +
        '<div class="win-sub">takes the series ' + series[0] + ' – ' + series[1] + ' (' + series[2] + ' draws)</div>',
      dismiss:false,
      actions:[
        {label:'🏠 Home', cls:'btn-ghost', fn:() => UI.home()},
        {label:'🔁 Rematch', cls:'btn-primary', fn:() => UI.gameStart('c4', UI.lastCfg)}
      ]
    });
  }
  $('#c-new').addEventListener('click', () => {
    if(dead) return;
    Snd.click();
    g = LOGIC.c4New(); turn = 1; over = false;
    render(true);
    updateStatus();
    maybeBot();
  });
  render(true);
  updateStatus();
  maybeBot();
  return { destroy(){ dead = true; } };
}
'use strict';
/* ================================================================
   SNAKES & LADDERS — UI + flow  (+ app boot)
   ================================================================ */
function SlUI(cfg, root){
  const PC = ['lav','mint','peach','sky'];
  const seats = cfg.seats;
  const level = cfg.level;
  const G = { players: seats.map(s => ({...s, pos: 1, done: false})), turn: 0, over: false };
  let dead = false;
  let phase = 'idle';
  const el = {};

  root.innerHTML =
    '<div class="screen sl">' + UI.topbar('Snakes & Ladders', {restart:true}) +
    '<div class="sl-wrap">' +
    '<div class="pl-row" id="s-chips"></div>' +
    '<div class="slboard" id="s-board"></div>' +
    '<div class="lbottom">' +
      '<div class="lb-info"><div class="lb-name" id="s-name"></div><div class="lb-hint" id="s-hint"></div></div>' +
      '<div class="dice dim" id="s-dice">' + diceHTML(6) + '</div>' +
    '</div></div></div>';
  UI.bindTopbar(root, 'sl');
  el.chips = $('#s-chips'); el.board = $('#s-board'); el.dice = $('#s-dice');
  el.name = $('#s-name'); el.hint = $('#s-hint');

  /* ---------- board ---------- */
  function center(n){ const c = LOGIC.slCell(n); return {x: c.x + 0.5, y: c.y + 0.5}; }
  function boardHTML(){
    let cells = '';
    for(let n = 1; n <= 100; n++){
      const c = LOGIC.slCell(n);
      const alt = (c.x + c.y) % 2 === 0;
      let cls = 'slcell' + (alt ? ' alt' : '');
      if(LOGIC.SL.ladders[n]) cls += ' lad';
      if(LOGIC.SL.snakes[n]) cls += ' snk';
      cells += '<div class="' + cls + '" style="left:' + (c.x * 10) + '%;top:' + (c.y * 10) + '%;width:10%;height:10%;position:absolute"><span class="n">' + n + '</span></div>';
    }
    // svg overlay: ladders + snakes
    let svg = '<svg class="slsvg" viewBox="0 0 100 100" preserveAspectRatio="none">';
    const sc = p => ({x: p.x * 10, y: p.y * 10});
    for(const a in LOGIC.SL.ladders){
      const A = sc(center(+a)), B = sc(center(LOGIC.SL.ladders[a]));
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
      const px = -dy / len * 1.7, py = dx / len * 1.7;
      svg += '<line x1="' + (A.x + px) + '" y1="' + (A.y + py) + '" x2="' + (B.x + px) + '" y2="' + (B.y + py) + '" stroke="#ffd98e" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>';
      svg += '<line x1="' + (A.x - px) + '" y1="' + (A.y - py) + '" x2="' + (B.x - px) + '" y2="' + (B.y - py) + '" stroke="#ffd98e" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>';
      const rungs = Math.max(2, Math.round(len / 5));
      for(let i = 1; i < rungs; i++){
        const t = i / rungs;
        const mx = A.x + dx * t, my = A.y + dy * t;
        svg += '<line x1="' + (mx + px) + '" y1="' + (my + py) + '" x2="' + (mx - px) + '" y2="' + (my - py) + '" stroke="#ffe7b8" stroke-width="0.8" stroke-linecap="round" opacity=".85"/>';
      }
    }
    const snakeCols = ['#ff9fb4','#9cc8ff','#b9a7ff','#8fe8c8','#ffc59e','#ffd98e','#ff8f9d','#7fdcb0','#7fb8ff','#c9b6ff'];
    let si = 0;
    for(const h in LOGIC.SL.snakes){
      const H = sc(center(+h)), T = sc(center(LOGIC.SL.snakes[h]));
      const col = snakeCols[si++ % snakeCols.length];
      const dx = T.x - H.x, dy = T.y - H.y, len = Math.hypot(dx, dy);
      const px = -dy / len, py = dx / len;
      const c1 = {x: H.x + dx * 0.3 + px * 9, y: H.y + dy * 0.3 + py * 9};
      const c2 = {x: H.x + dx * 0.7 - px * 9, y: H.y + dy * 0.7 - py * 9};
      svg += '<path d="M ' + H.x + ' ' + H.y + ' C ' + c1.x + ' ' + c1.y + ', ' + c2.x + ' ' + c2.y + ', ' + T.x + ' ' + T.y + '" fill="none" stroke="' + col + '" stroke-width="1.9" stroke-linecap="round" opacity=".8"/>';
      svg += '<circle cx="' + H.x + '" cy="' + H.y + '" r="2.1" fill="' + col + '" opacity=".95"/>';
      svg += '<circle cx="' + (H.x - 0.7) + '" cy="' + (H.y - 0.6) + '" r="0.45" fill="#1a1f3a"/><circle cx="' + (H.x + 0.7) + '" cy="' + (H.y - 0.6) + '" r="0.45" fill="#1a1f3a"/>';
    }
    svg += '</svg>';
    return cells + svg;
  }
  el.board.innerHTML = boardHTML();

  /* pieces */
  const pieces = [];
  G.players.forEach((P, pi) => {
    const d = document.createElement('div');
    d.className = 'spiece c-' + PC[pi];
    d.textContent = P.name.slice(0, 1).toUpperCase();
    el.board.appendChild(d);
    pieces.push(d);
  });
  function layoutPieces(){
    const groups = {};
    G.players.forEach((P, pi) => {
      const c = center(P.pos);
      (groups[P.pos] = groups[P.pos] || []).push({el: pieces[pi], c, pi});
    });
    for(const k in groups){
      const g = groups[k];
      g.forEach((it, i) => {
        const off = g.length === 1 ? {x: 0, y: 0} :
          {x: Math.cos(i / g.length * Math.PI * 2) * 1.9, y: Math.sin(i / g.length * Math.PI * 2) * 1.9};
        it.el.style.left = ((it.c.x * 10) + off.x) + '%';
        it.el.style.top = ((it.c.y * 10) + off.y) + '%';
      });
    }
  }
  layoutPieces();

  /* ---------- panel ---------- */
  function renderChips(){
    el.chips.innerHTML = G.players.map((P, pi) =>
      '<div class="pl-chip' + (G.turn === pi && !G.over && !P.done ? ' active' : '') + (P.done ? ' done' : '') + '">' +
      '<div class="av av-' + PC[pi] + '">' + esc(P.name.slice(0,1).toUpperCase()) + (P.bot ? '<span style="position:absolute;bottom:-4px;right:-4px;font-size:12px">🤖</span>' : '') + '</div>' +
      '<div class="p-name">' + esc(P.name) + '</div>' +
      '<div class="p-sub">' + (P.done ? '🏅 finished' : 'sq ' + P.pos) + '</div></div>').join('');
  }
  function renderPanel(msg){
    const P = G.players[G.turn];
    el.name.innerHTML = '<span class="ndot" style="background:var(--' + (PC[G.turn] === 'lav' ? 'lav' : PC[G.turn]) + ')"></span>' + esc(P.name) + (P.bot ? ' 🤖' : '');
    el.hint.textContent = msg || '';
    el.dice.classList.toggle('dim', !(phase === 'roll' && !P.bot && !P.done));
  }

  /* ---------- flow ---------- */
  function toRoll(){
    if(dead || G.over) return;
    const P = G.players[G.turn];
    if(P.done){ endTurn(); return; }
    phase = 'roll';
    renderChips(); renderPanel(P.bot ? 'rolling…' : 'Your turn — tap the dice! 🎲');
    if(P.bot) Timers.set(() => { if(!dead) doRoll(); }, 800 + Math.random() * 600);
  }
  el.dice.addEventListener('click', () => {
    if(dead || phase !== 'roll' || G.players[G.turn].bot) return;
    doRoll();
  });
  async function doRoll(){
    if(dead) return;
    phase = 'anim';
    const pi = G.turn, P = G.players[pi];
    const v = LOGIC.ludoRollDie();
    renderPanel('rolling…');
    await new Promise(r => rollDiceAnim(el.dice, v, r));
    if(dead) return;
    const {target, bounced} = LOGIC.slNext(P.pos, v);
    // walk step by step
    pieces[pi].style.zIndex = 8;
    let n = P.pos;
    const seq = [];
    if(!bounced){ for(let s = n + 1; s <= target; s++) seq.push(s); }
    else { for(let s = n + 1; s <= 100; s++) seq.push(s); for(let s = 99; s >= target; s--) seq.push(s); }
    for(const s of seq){
      n = s;
      const c = center(s);
      pieces[pi].style.left = (c.x * 10) + '%';
      pieces[pi].style.top = (c.y * 10) + '%';
      Snd.hop();
      await wait(160);
      if(dead) return;
    }
    if(bounced){ Toast.show('🎯 Needs exactly 100 — bounced back to ' + target); Snd.sad(); }
    P.pos = target;
    layoutPieces();
    await wait(250);
    // snake or ladder?
    const jump = LOGIC.slJump(target);
    if(jump){
      pieces[pi].classList.add('glide');
      const c = center(jump.to);
      pieces[pi].style.left = (c.x * 10) + '%';
      pieces[pi].style.top = (c.y * 10) + '%';
      if(jump.kind === 'ladder'){ Snd.ladder(); Toast.show('🪜 Ladder! ' + target + ' → ' + jump.to); }
      else { Snd.snake(); Toast.show('🐍 Snake… ' + target + ' → ' + jump.to); }
      buzz(30);
      await wait(700);
      if(dead) return;
      pieces[pi].classList.remove('glide');
      P.pos = jump.to;
      layoutPieces();
      renderChips();
      await wait(250);
    }
    pieces[pi].style.zIndex = 5;
    // win?
    if(P.pos === 100){
      P.done = true;
      G.over = true;
      renderChips();
      Snd.win(); Confetti.burst(130); buzz([50,60,90]);
      Timers.set(() => {
        if(dead) return;
        Modal.open({
          title: '🏆 Winner!',
          html: '<div class="win-emoji">🎉</div><div class="win-name">' + esc(P.name) + '</div>' +
            '<div class="win-sub">reached square 100 first!</div>' +
            '<div class="podium">' + G.players.map((Q, i) =>
              '<div class="pod-row"><span class="medal">' + (Q.done ? '🥇' : '🏁') + '</span><span class="pn">' + esc(Q.name) + '</span><span class="pd">square ' + Q.pos + '</span></div>').join('') + '</div>',
          dismiss: false,
          actions: [
            {label:'🏠 Home', cls:'btn-ghost', fn:() => UI.home()},
            {label:'🔁 Rematch', cls:'btn-primary', fn:() => UI.gameStart('sl', UI.lastCfg)}
          ]
        });
      }, 900);
      return;
    }
    if(v === 6){
      Toast.show('6️⃣ Bonus roll for ' + P.name + '!');
      renderPanel('Bonus roll! 🎲');
      await wait(550);
      if(!dead) doRoll();
      return;
    }
    endTurn();
  }
  function endTurn(){
    if(dead || G.over) return;
    let guard = 0;
    do { G.turn = adv(G.turn, 1, G.players.length); } while(G.players[G.turn].done && ++guard < 8);
    toRoll();
  }
  renderChips();
  toRoll();
  return { destroy(){ dead = true; } };
}
