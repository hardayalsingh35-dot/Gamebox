<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<title>GameBox — UNO, Ludo &amp; More</title>
<style>
/* ============ tokens ============ */
:root{
  --bg1:#12172b; --bg2:#1b2140;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.18);
  --text:#eef1ff; --muted:#a3aacf; --faint:#7b84ad;
  --lav:#b9a7ff; --mint:#8fe8c8; --peach:#ffc59e; --sky:#9cc8ff; --rose:#ff9fb4; --gold:#ffd98e;
  --red:#ff8f9d; --red-d:#d05868; --yel:#ffd47e; --yel-d:#c99722; --grn:#7fdcb0; --grn-d:#3f9e71;
  --blu:#7fb8ff; --blu-d:#4d7fd0;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 10px 30px rgba(5,8,20,.45);
  --maxw:560px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  color:var(--text); background:#12172b; overflow:hidden; position:fixed; inset:0; width:100%;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
input{ -webkit-user-select:text; user-select:text; }
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}

/* ============ background ============ */
#bg{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,#151b38 100%);z-index:0;overflow:hidden}
#bg .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
#bg .b1{width:46vmax;height:46vmax;left:-16vmax;top:-14vmax;background:radial-gradient(circle,#5b4a9e66,transparent 70%)}
#bg .b2{width:40vmax;height:40vmax;right:-14vmax;top:30%;background:radial-gradient(circle,#1f5e6d66,transparent 70%);animation-delay:-8s}
#bg .b3{width:36vmax;height:36vmax;left:10%;bottom:-18vmax;background:radial-gradient(circle,#6e3a5e66,transparent 70%);animation-delay:-16s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}

/* ============ layout ============ */
#app{position:relative;z-index:1;height:100%;max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;flex:none}
.topbar .tb-title{flex:1;font-weight:800;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;min-width:0}
.topbar .tb-title span.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s,background .2s;flex:none}
.icon-btn:active{transform:scale(.9)}
.icon-btn.on{background:rgba(185,167,255,.18);border-color:rgba(185,167,255,.35)}

/* ============ buttons ============ */
.btn{border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;letter-spacing:.2px;transition:transform .15s,filter .2s;text-align:center}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#0e1230;box-shadow:0 8px 24px rgba(120,120,255,.28)}
.btn-ghost{background:var(--glass);border:1px solid var(--stroke2)}
.btn-danger{background:rgba(255,120,140,.14);border:1px solid rgba(255,120,140,.35);color:#ffb3be}
.btn-lg{padding:17px 22px;font-size:18px;border-radius:20px}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted);transition:all .18s}
.seg button.sel{background:linear-gradient(135deg,rgba(167,139,250,.85),rgba(96,165,250,.85));color:#0e1230}
.seg.small button{padding:7px 12px;font-size:12.5px}
.txt{width:100%;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;color:var(--text);padding:12px 14px;font-size:15px;font-weight:600;outline:none}
.txt:focus{border-color:rgba(185,167,255,.5)}

/* ============ home ============ */
.hero{display:flex;align-items:center;gap:14px;padding:18px 4px 6px}
.hero .logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#a78bfa,#60a5fa);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(120,120,255,.35);flex:none}
.hero h1{font-size:26px;font-weight:900;letter-spacing:.3px;background:linear-gradient(90deg,#eef1ff,#b9a7ff 60%,#8fe8c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:12.5px;margin-top:2px}
.gcards{display:flex;flex-direction:column;gap:14px;padding:14px 0}
.gcard{display:flex;align-items:center;gap:15px;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:16px;transition:transform .16s,background .2s;box-shadow:var(--shadow)}
.gcard:active{transform:scale(.975);background:var(--glass2)}
.gcard .art{width:88px;height:88px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.gcard .gc-name{font-size:18px;font-weight:800}
.gcard .gc-sub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
.gcard .gc-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gcard .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:4px 9px;border-radius:99px;background:rgba(185,167,255,.13);color:#cbbcff;border:1px solid rgba(185,167,255,.22)}
.gcard .tag.t2{background:rgba(143,232,200,.12);color:#a9f0d8;border-color:rgba(143,232,200,.2)}
.gcard .chev{color:var(--faint);font-size:20px;flex:none}
.home-foot{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 10px;flex-wrap:wrap}
.foot-chip{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--stroke);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--muted)}
.foot-chip:active{transform:scale(.95)}
.credits{text-align:center;color:var(--faint);font-size:11px;padding:14px 0 4px;line-height:1.6}

/* ============ setup ============ */
.setup h2{font-size:22px;font-weight:900;padding:8px 2px 2px}
.setup .sub{color:var(--muted);font-size:13px;padding:2px 2px 12px}
.panel{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-md);padding:14px;margin-bottom:14px}
.panel .p-label{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.seat{display:flex;align-items:center;gap:10px;padding:9px 0}
.seat .dot{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#10142e}
.seat .txt{flex:1;min-width:0}
.seat .seg{flex:none}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;flex-wrap:wrap}
.opt-row .o-name{font-weight:700;font-size:14.5px}
.opt-row .o-hint{color:var(--faint);font-size:11.5px;margin-top:2px}
.setup-actions{display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.tip{color:var(--faint);font-size:11.5px;text-align:center;padding:2px 10px 8px;line-height:1.5}

/* ============ modal ============ */
#modals{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:22px}
#modals.show{display:flex}
#modals .backdrop{position:absolute;inset:0;background:rgba(8,10,24,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .22s}
.modal{position:relative;width:100%;max-width:400px;background:linear-gradient(165deg,#232a4d,#1a2040);border:1px solid var(--stroke2);border-radius:26px;padding:22px;box-shadow:0 24px 70px rgba(0,0,8,.6);animation:popIn .28s cubic-bezier(.2,1.4,.4,1);max-height:82vh;overflow-y:auto}
.modal h3{font-size:19px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal .m-body{color:var(--muted);font-size:14px;line-height:1.65}
.modal .m-body b{color:var(--text)}
.modal .m-actions{display:flex;gap:10px;margin-top:18px}
.modal .m-actions .btn{flex:1;padding:13px 10px;font-size:15px}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.86) translateY(14px)}}
.rules-list{padding-left:0;list-style:none}
.rules-list li{display:flex;gap:10px;padding:6px 0;font-size:13.5px;line-height:1.55}
.rules-list li .ri{flex:none;font-size:15px}

/* ============ toast ============ */
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:rgba(28,33,62,.92);border:1px solid var(--stroke2);color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;box-shadow:0 12px 34px rgba(0,0,10,.5);animation:toastIn .3s cubic-bezier(.2,1.3,.4,1);max-width:100%;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}

/* ============ avatars / players ============ */
.pl-row{display:flex;gap:8px;padding:4px 0 8px;justify-content:center;flex-wrap:wrap}
.pl-chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px;padding:8px 8px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);transition:all .25s;flex:1;max-width:110px}
.pl-chip.active{background:rgba(185,167,255,.12);border-color:rgba(185,167,255,.45);box-shadow:0 0 22px rgba(150,140,255,.18)}
.pl-chip.done{opacity:.55}
.pl-chip .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#10142e;position:relative}
.pl-chip .p-name{font-size:11px;font-weight:700;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-chip .p-sub{font-size:10px;color:var(--faint);font-weight:700}
.av-lav{background:linear-gradient(135deg,#c9b6ff,#9f86ef)}
.av-mint{background:linear-gradient(135deg,#a5f0d5,#63cfa8)}
.av-peach{background:linear-gradient(135deg,#ffd6b3,#ffab7a)}
.av-sky{background:linear-gradient(135deg,#b0d4ff,#7cabf0)}
.av-green{background:linear-gradient(135deg,#a5f0d5,#63cfa8)}
.av-yellow{background:linear-gradient(135deg,#ffe3a1,#ffc45e)}
.av-blue{background:linear-gradient(135deg,#b0d4ff,#7cabf0)}
.av-red{background:linear-gradient(135deg,#ffb3be,#f97e93)}
.bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd98e,#ffb36b);color:#402d10;font-size:11.5px;font-weight:900;padding:5px 11px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:popIn .25s cubic-bezier(.2,1.5,.4,1);z-index:5}
.bubble:after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:#ffc27e;border-radius:2px}
.think-dots{display:inline-flex;gap:3px;align-items:center}
.think-dots i{width:5px;height:5px;border-radius:50%;background:var(--lav);animation:blink 1s infinite}
.think-dots i:nth-child(2){animation-delay:.2s}.think-dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ============ dice ============ */
.dice{width:74px;height:74px;border-radius:20px;background:linear-gradient(150deg,#f4f1ff,#d9d4ff);box-shadow:0 10px 26px rgba(90,80,200,.4),inset 0 -4px 0 rgba(120,110,220,.25);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;gap:2px;transition:transform .15s}
.dice:active{transform:scale(.93)}
.dice .pip{width:9px;height:9px;border-radius:50%;background:#3a3560;place-self:center}
.dice.dim{opacity:.55;box-shadow:none}
.dice.land{animation:diceLand .3s}
@keyframes diceLand{0%{transform:scale(1.18)}60%{transform:scale(.95)}100%{transform:scale(1)}}

/* ============ UNO ============ */
.uno-main{flex:1;display:flex;flex-direction:column;min-height:0}
.u-center{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:26px;padding:6px 12px}
.u-pilewrap,.u-discwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.upile{position:relative;width:76px;height:114px;border-radius:14px;background:linear-gradient(150deg,#2c3260,#232848);border:2px solid rgba(255,255,255,.22);box-shadow:4px 4px 0 rgba(0,0,10,.35),0 12px 26px rgba(0,0,10,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.upile:active{transform:scale(.94)}
.upile .ucount{position:absolute;bottom:-9px;background:#232950;border:1px solid var(--stroke2);border-radius:99px;font-size:10.5px;font-weight:800;padding:3px 9px;color:var(--muted)}
.upile .uback-glyph{font-size:26px;opacity:.85}
.upile.can{animation:glowPulse 1.6s infinite;border-color:rgba(185,167,255,.6)}
.u-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.u-discwrap{position:relative}
.uring{position:absolute;width:150px;height:150px;border-radius:50%;filter:blur(2px);opacity:.5;transition:background .4s;z-index:-1}
.uring.r{background:radial-gradient(circle,#ff8f9d66,transparent 65%)}
.uring.y{background:radial-gradient(circle,#ffd47e66,transparent 65%)}
.uring.g{background:radial-gradient(circle,#7fdcb066,transparent 65%)}
.uring.b{background:radial-gradient(circle,#7fb8ff66,transparent 65%)}
.udir{position:absolute;top:-4px;right:-26px;font-size:19px;color:var(--muted);transition:transform .4s}
.udir .arr{display:inline-block}
.ucard{--uw:62px;--uh:92px;width:var(--uw);height:var(--uh);border-radius:calc(var(--uw)*.16);position:relative;flex:none;background:linear-gradient(155deg,var(--cc),var(--cc2));box-shadow:0 4px 12px rgba(5,8,25,.5);border:3px solid #f4f4fb;overflow:hidden}
.ucard:before{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.25);pointer-events:none}
.ucard .ell{position:absolute;left:50%;top:50%;width:78%;height:82%;transform:translate(-50%,-50%) rotate(-18deg);background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.ucard .glyph{font-weight:900;font-size:calc(var(--uw)*.42);color:var(--cd);transform:rotate(18deg)}
.ucard .cor{position:absolute;font-weight:900;font-size:calc(var(--uw)*.2);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.ucard .cor.tl{top:5%;left:9%}
.ucard .cor.br{bottom:5%;right:9%;transform:rotate(180deg)}
.ucard.c-r{--cc:#ff8f9d;--cc2:#e26a7c;--cd:#d84a5e}
.ucard.c-y{--cc:#ffd47e;--cc2:#f0b34e;--cd:#d09019}
.ucard.c-g{--cc:#7fdcb0;--cc2:#58c491;--cd:#2f9e6c}
.ucard.c-b{--cc:#7fb8ff;--cc2:#5a94f0;--cd:#3f74d6}
.ucard.c-w{background:linear-gradient(150deg,#3a4166,#2b3050);--cd:#3a4166}
.ucard.c-w .ell{background:conic-gradient(from 40deg,#ff8f9d,#ffd47e,#7fdcb0,#7fb8ff,#ff8f9d)}
.ucard.c-w .glyph{color:#2e3355;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.ucard.c-w.W4 .ell{background:conic-gradient(from 0deg,#ff8f9d 0 25%,#ffd47e 0 50%,#7fdcb0 0 75%,#7fb8ff 0)}
.u-discard .ucard{--uw:88px;--uh:132px}
.hand-wrap{position:relative;flex:none;padding-top:6px}
.hand{display:flex;overflow-x:auto;overflow-y:visible;padding:12px 16px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:flex-end;min-height:128px}
.hand::-webkit-scrollbar{display:none}
.hand .ucard{margin-left:-24px;transform:rotate(var(--r,0deg)) translateY(var(--ty,0px));transition:transform .18s,filter .2s;transform-origin:50% 100%}
.hand .ucard:first-child{margin-left:0}
.hand .ucard.ok{--ty:-14px;box-shadow:0 0 0 3px rgba(185,167,255,.75),0 10px 24px rgba(120,110,255,.35);cursor:pointer}
.hand .ucard.ok:active{transform:rotate(var(--r,0deg)) translateY(-22px) scale(1.06)}
.hand .ucard.dim{filter:saturate(.35) brightness(.6)}
.hand .ucard.wiggle{animation:wiggle .3s}
@keyframes wiggle{0%,100%{margin-left:-24px}25%{transform:rotate(var(--r,0deg)) translateX(-5px)}75%{transform:rotate(var(--r,0deg)) translateX(5px)}}
.u-me-bar{display:flex;align-items:center;justify-content:space-between;padding:0 18px 2px;flex:none}
.u-me-bar .who{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.u-me-bar .who .tdot{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.u-me-bar .who .tdot.turn{background:var(--gold);animation:blink 1.2s infinite}
.u-me-bar .hcount{font-size:11.5px;color:var(--faint);font-weight:700}
.uno-btn{position:absolute;right:14px;top:-16px;z-index:6;background:linear-gradient(135deg,#ff9fb4,#ff7a94);color:#4d1020;font-weight:900;font-size:19px;letter-spacing:1px;padding:13px 22px;border-radius:99px;box-shadow:0 10px 30px rgba(255,110,140,.45);animation:unoPulse .9s infinite}
@keyframes unoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.drawn-choice{display:flex;align-items:center;gap:12px;background:rgba(20,25,50,.92);border:1px solid var(--stroke2);border-radius:20px;padding:10px 12px;margin:0 14px 10px;animation:popIn .25s}
.drawn-choice .dc-label{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.4}
.drawn-choice .ucard{--uw:42px;--uh:63px}
.drawn-choice .btn{padding:10px 14px;font-size:13px;border-radius:13px}
.flyer{position:fixed;z-index:70;transition:transform .38s cubic-bezier(.3,.7,.4,1);pointer-events:none}
.flyer .ucard{--uw:100%;--uh:100%;width:100%;height:100%}
.u-ticker{text-align:center;font-size:12px;color:var(--faint);font-weight:700;min-height:18px;padding:0 12px 4px;flex:none}
.veil{position:absolute;inset:0;z-index:30;background:linear-gradient(165deg,rgba(18,22,44,.97),rgba(24,28,58,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;animation:fadeIn .25s}
.veil .v-big{font-size:46px}
.veil .v-t1{font-size:20px;font-weight:900}
.veil .v-t2{color:var(--muted);font-size:13.5px;font-weight:700}
.colorpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.colorpick button{height:72px;border-radius:20px;font-weight:900;font-size:15px;color:rgba(20,10,20,.75);box-shadow:0 8px 22px rgba(0,0,10,.35);transition:transform .15s}
.colorpick button:active{transform:scale(.93)}
.cp-r{background:linear-gradient(140deg,#ff9fae,#f2707f)}
.cp-y{background:linear-gradient(140deg,#ffd98e,#ffbe55)}
.cp-g{background:linear-gradient(140deg,#95e8c0,#5ed3a0)}
.cp-b{background:linear-gradient(140deg,#96c3ff,#6ba1f5)}
.score-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.score-tbl td,.score-tbl th{padding:9px 8px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--stroke)}
.score-tbl th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.score-tbl td b{font-size:15px}
.score-tbl tr.lead td{color:var(--gold)}
.round-gain{text-align:center;font-size:15px;font-weight:800;color:var(--mint);padding:6px 0 2px}

/* ============ LUDO ============ */
.ludo-wrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 10px}
.lboard{position:relative;width:100%;max-width:min(100%,calc(100vh - 300px));aspect-ratio:1;margin:2px auto 6px;border-radius:18px;background:#20264a;border:1px solid var(--stroke);box-shadow:var(--shadow);flex:none}
.lcell{position:absolute;width:6.667%;height:6.667%;background:#2c3358;border-radius:22%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.lcell.start.c-green{background:rgba(127,220,176,.5)}
.lcell.start.c-yellow{background:rgba(255,212,126,.5)}
.lcell.start.c-blue{background:rgba(127,184,255,.5)}
.lcell.start.c-red{background:rgba(255,143,157,.5)}
.lcell.star:after{content:'★';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.1vmin;color:rgba(255,255,255,.5)}
.lcell.hcell.c-green{background:rgba(127,220,176,.32)}
.lcell.hcell.c-yellow{background:rgba(255,212,126,.32)}
.lcell.hcell.c-blue{background:rgba(127,184,255,.32)}
.lcell.hcell.c-red{background:rgba(255,143,157,.32)}
.lbase{position:absolute;width:40%;height:40%;border-radius:16%;background:rgba(255,255,255,.03);border:1px solid var(--stroke)}
.lbase.c-green{background:rgba(127,220,176,.13)}
.lbase.c-yellow{background:rgba(255,212,126,.13)}
.lbase.c-blue{background:rgba(127,184,255,.13)}
.lbase.c-red{background:rgba(255,143,157,.13)}
.lslot{position:absolute;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(10,13,30,.45);box-shadow:inset 0 2px 6px rgba(0,0,10,.6)}
.lcenter{position:absolute;left:40%;top:40%;width:20%;height:20%}
.lcenter svg{width:100%;height:100%;display:block}
.ltok{position:absolute;width:5.4%;height:5.4%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffffcc,var(--tc) 42%,var(--tc2));border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(5,8,25,.55);transition:left .13s linear,top .13s linear,transform .2s;z-index:5}
.ltok.c-green{--tc:#7fdcb0;--tc2:#2f9e6c}
.ltok.c-yellow{--tc:#ffd47e;--tc2:#c99722}
.ltok.c-blue{--tc:#7fb8ff;--tc2:#4d7fd0}
.ltok.c-red{--tc:#ff8f9d;--tc2:#d84a5e}
.ltok.canmove{animation:tokPulse 1s infinite;z-index:6;cursor:pointer}
.ltok.canmove:after{content:'';position:absolute;inset:-38%;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);animation:ringPulse 1s infinite}
@keyframes tokPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.14)}}
@keyframes ringPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.ltok.stack{width:4.4%;height:4.4%}
.ltok.flyhome{transition:left .55s cubic-bezier(.4,.1,.5,1),top .55s cubic-bezier(.4,.1,.5,1);z-index:8}
.ltok.homeward{width:3.6%;height:3.6%;opacity:.92;box-shadow:0 0 10px var(--tc)}
.lbottom{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 0 calc(12px + env(safe-area-inset-bottom))}
.lbottom .lb-info{display:flex;flex-direction:column;gap:5px;max-width:170px}
.lbottom .lb-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
.lbottom .lb-name .ndot{width:11px;height:11px;border-radius:50%}
.lbottom .lb-hint{font-size:11.5px;color:var(--faint);font-weight:700;line-height:1.4}
.lhomecount{font-size:10px;font-weight:800;color:var(--faint)}

/* ============ TIC TAC TOE ============ */
.ttt-board{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:14px auto 8px}
.ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;height:100%}
.tcell{background:var(--glass);border:1px solid var(--stroke);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;transition:background .18s,transform .12s}
.tcell:active{transform:scale(.95)}
.tcell .x{color:var(--sky);animation:popIn .22s cubic-bezier(.2,1.5,.4,1)}
.tcell .o{color:var(--peach);animation:popIn .22s cubic-bezier(.2,1.5,.4,1)}
.tcell.win{background:rgba(185,167,255,.16);border-color:rgba(185,167,255,.5);animation:winCell 1s infinite}
@keyframes winCell{0%,100%{box-shadow:0 0 0 rgba(185,167,255,0)}50%{box-shadow:0 0 24px rgba(185,167,255,.5)}}
.ttt-strike{position:absolute;inset:0;pointer-events:none;z-index:4}
.ttt-strike line{stroke:var(--lav);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(185,167,255,.8));stroke-dasharray:600;stroke-dashoffset:600;animation:strike .45s ease-out forwards}
@keyframes strike{to{stroke-dashoffset:0}}
.series-row{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0 2px}
.series-box{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:86px}
.series-box .sb-name{font-size:11.5px;font-weight:800;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.series-box .sb-score{font-size:26px;font-weight:900}
.series-box.p1 .sb-score{color:var(--sky)}
.series-box.p2 .sb-score{color:var(--peach)}
.series-draws{font-size:11.5px;color:var(--faint);font-weight:700;text-align:center;padding-top:4px}
.status-line{text-align:center;font-size:14px;font-weight:800;color:var(--muted);padding:8px 0 4px;min-height:24px}

/* ============ CONNECT FOUR ============ */
.c4-board{width:min(94vw,380px);margin:12px auto;background:linear-gradient(165deg,#3d4478,#2c3160);border-radius:22px;padding:10px;box-shadow:var(--shadow);border:1px solid var(--stroke2)}
.c4-cols{display:flex;gap:7px}
.c4-col{flex:1;display:flex;flex-direction:column;gap:7px;border-radius:12px;padding:4px 2px;transition:background .15s}
.c4-col.tappable{cursor:pointer}
.c4-col.tappable:active{background:rgba(255,255,255,.07)}
.c4-cell{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#1d2244,#161a36);box-shadow:inset 0 3px 8px rgba(0,0,10,.65);position:relative;overflow:visible}
.disc{position:absolute;inset:0;border-radius:50%;animation:drop .42s cubic-bezier(.35,.7,.35,1.15)}
.disc.p1{background:radial-gradient(circle at 36% 30%,#ffc9d4,#ff8fa2 55%,#e2637a)}
.disc.p2{background:radial-gradient(circle at 36% 30%,#ffe6b0,#ffcf6e 55%,#eda83a)}
.disc.win{animation:winCell 0.9s infinite;border:3px solid rgba(255,255,255,.85)}
@keyframes drop{from{transform:translateY(calc(-1 * var(--d,300px)))}to{transform:translateY(0)}}

/* ============ SNAKES & LADDERS ============ */
.sl-wrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 10px}
.slboard{position:relative;width:100%;max-width:min(100%,calc(100vh - 300px));aspect-ratio:1;margin:2px auto 8px;border-radius:18px;background:#1e2445;border:1px solid var(--stroke);box-shadow:var(--shadow);overflow:hidden;flex:none}
.slgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.slcell{position:relative;border:.5px solid rgba(255,255,255,.045)}
.slcell .n{position:absolute;top:5%;left:7%;font-size:1.55vmin;font-weight:700;color:rgba(255,255,255,.34)}
.slcell.alt{background:rgba(255,255,255,.028)}
.slcell.lad{background:rgba(143,232,200,.07)}
.slcell.snk{background:rgba(255,159,180,.07)}
.slcell.lad .n,.slcell.snk .n{color:rgba(255,255,255,.62);font-weight:900}
.slsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.spiece{position:absolute;width:4.6%;height:4.6%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffffdd,var(--tc) 45%,var(--tc2));border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 9px rgba(5,8,25,.6);transition:left .17s ease,top .17s ease;z-index:5;font-size:1.9vmin;font-weight:900;color:#141833;display:flex;align-items:center;justify-content:center}
.spiece.c-lav{--tc:#c9b6ff;--tc2:#8d74e8}
.spiece.c-mint{--tc:#a5f0d5;--tc2:#4fc49a}
.spiece.c-peach{--tc:#ffd6b3;--tc2:#f09b62}
.spiece.c-sky{--tc:#b0d4ff;--tc2:#6b9be8}
.spiece.glide{transition:left .65s cubic-bezier(.45,.1,.4,1),top .65s cubic-bezier(.45,.1,.4,1);z-index:7}
.spiece.win-piece{animation:winCell .9s infinite}

/* ============ win modal / podium ============ */
.win-emoji{font-size:52px;text-align:center;padding:6px 0 2px;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.win-name{text-align:center;font-size:22px;font-weight:900;margin-bottom:4px}
.win-sub{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:10px}
.podium{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pod-row{display:flex;align-items:center;gap:11px;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:10px 13px}
.pod-row .medal{font-size:21px;width:30px;text-align:center;flex:none}
.pod-row .pn{flex:1;font-weight:800;font-size:14.5px}
.pod-row .pd{color:var(--faint);font-size:11.5px;font-weight:700}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

/* ============ misc ============ */
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s}
.divider{height:1px;background:var(--stroke);margin:10px 0}
@media (max-height:640px){
  .u-discard .ucard{--uw:70px;--uh:105px}
  .hand{min-height:112px}
  .hand .ucard{--uw:54px;--uh:81px}
  .dice{width:62px;height:62px;border-radius:16px;padding:10px}
  .dice .pip{width:8px;height:8px}
}
@media (min-width:600px){
  body{box-shadow:inset 0 0 0 1px var(--stroke)}
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="app"></div>
<div id="toasts"></div>
<div id="modals"></div>
<canvas id="confetti"></canvas>
